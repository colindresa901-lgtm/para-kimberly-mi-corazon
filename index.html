
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para el amor de mi vida ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(
                circle at center,
                #401044 0%,
                #1c092b 45%,
                #090414 100%
            );
            color: white;
        }

        /* Luces decorativas del fondo */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 20%,
                    rgba(255, 30, 130, 0.18), transparent 35%),
                radial-gradient(circle at 80% 80%,
                    rgba(164, 50, 255, 0.20), transparent 35%);
            pointer-events: none;
        }

        .contenedor {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 750px;
            padding: 40px 20px;
            text-align: center;
            animation: aparecer 2s ease;
        }

        .corazon-principal {
            font-size: clamp(65px, 12vw, 100px);
            display: inline-block;
            filter: drop-shadow(0 0 15px #ff248b);
            animation: latido 1.5s infinite;
        }

        h1 {
            margin: 20px 0;
            font-size: clamp(35px, 7vw, 65px);
            line-height: 1.2;
            color: #fff0fa;
            text-shadow:
                0 0 5px #fff,
                0 0 12px #ff4da6,
                0 0 25px #ff168b,
                0 0 45px #ff168b;
            animation: brillo 2s infinite alternate;
        }

        .subtitulo {
            font-size: clamp(16px, 3vw, 21px);
            color: #ffd5ec;
            line-height: 1.8;
            margin: 20px auto 35px;
            max-width: 550px;
        }

        .boton {
            display: inline-block;
            padding: 16px 35px;
            border: 2px solid #ff91ce;
            border-radius: 50px;
            background: linear-gradient(45deg, #ff168b, #a42bff);
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow:
                0 0 12px #ff168b,
                0 0 30px rgba(255, 22, 139, 0.5);
            transition: transform 0.3s, box-shadow 0.3s;
            animation: flotar 2s ease-in-out infinite;
        }

        .boton:hover {
            transform: scale(1.1);
            box-shadow:
                0 0 20px #ff8ccc,
                0 0 50px #ff168b;
        }

        .frase-final {
            margin-top: 35px;
            font-size: 14px;
            color: #dcb6ed;
            letter-spacing: 2px;
        }

        /* Corazones flotantes */
        .corazon {
            position: fixed;
            bottom: -60px;
            z-index: 1;
            color: #ff4f9a;
            opacity: 0;
            pointer-events: none;
            user-select: none;
            text-shadow: 0 0 15px #ff168b;
            animation: subir linear forwards;
        }

        @keyframes subir {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.7);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            80% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-115vh) rotate(360deg) scale(1.3);
                opacity: 0;
            }
        }

        @keyframes latido {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        @keyframes brillo {
            from {
                filter: brightness(0.9);
            }
            to {
                filter: brightness(1.4);
            }
        }

        @keyframes flotar {
            0%, 100% { translate: 0 0; }
            50% { translate: 0 -6px; }
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>

    <main class="contenedor">
        <div class="corazon-principal">💖</div>

        <!-- Cambia este texto por su nombre -->
        <h1>Para mi corazon</h1>

        <p class="subtitulo">
            Hice este pequeño lugar pensando en ti,
            porque eres una de las cosas más bonitas
            que me han pasado en la vida. ❤️
            <br>
            Hoy tengo una sorpresa para ti...
        </p>

        <!-- Este botón abre la segunda página -->
        <a href="parati.html" class="boton">
            ✨ Pulsa aquí, Kimberly  ✨
        </a>

        <p class="frase-final">
            HECHO CON TODO MI AMOR ♥
        </p>
    </main>

    <script>
        // Crear corazones flotantes automáticamente
        const simbolos = ["💗", "💕", "💖", "❤️", "💘", "✨"];

        function crearCorazon() {
            const corazon = document.createElement("span");

            corazon.classList.add("corazon");
            corazon.textContent =
                simbolos[Math.floor(Math.random() * simbolos.length)];

            corazon.style.left = Math.random() * 100 + "vw";
            corazon.style.fontSize = (15 + Math.random() * 25) + "px";
            corazon.style.animationDuration = (6 + Math.random() * 7) + "s";

            document.body.appendChild(corazon);

            setTimeout(() => {
                corazon.remove();
            }, 14000);
        }

        // Aparecen nuevos corazones cada 300 milisegundos
        setInterval(crearCorazon, 300);
    </script>

</body>
</html>
